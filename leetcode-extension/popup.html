<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LeetGit</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

<main class="app-shell">

    <!-- ================= HEADER ================= -->

    <header class="app-header">

        <div class="brand">

            <img
                    class="brand-logo"
                    src="assets/leetgit-logo.png"
                    alt="LeetGit"
            >

            <div class="brand-copy">

                <div class="brand-name">
                    Leet<span>Git</span>
                </div>

                <div class="brand-tagline">
                    DSA <b>→</b> GITHUB <span>SYNC</span>
                </div>

            </div>

        </div>

        <div class="header-actions">

            <button
                    class="icon-button"
                    id="settings-button"
                    type="button"
                    aria-label="Settings"
            >
                ⚙
            </button>

            <button
                    class="icon-button close-button"
                    id="close-button"
                    type="button"
                    aria-label="Close"
            >
                ×
            </button>

        </div>

    </header>


    <!-- ================= DYNAMIC CONTENT ================= -->

    <div id="login-section" class="app-content">

        <div class="loading-state">

            <div class="loader"></div>

            <span>
                Loading LeetGit...
            </span>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer class="app-footer">

        <span>
            Built with
            <span class="heart">♥</span>
            for developers
        </span>

        <span>
            v1.0.0
        </span>

    </footer>

</main>


<script src="popup.js"></script>

</body>
</html>

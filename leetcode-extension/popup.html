<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>LeetGit</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 20px;

            width: 360px;

            min-height: 500px;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            background: #ffffff;

            color: #1f2937;
        }


        h2 {

            margin-top: 0;

            margin-bottom: 20px;

            font-size: 24px;
        }


        h4 {

            margin-bottom: 15px;
        }


        input,
        select {

            width: 100%;

            padding: 10px;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            font-size: 14px;
        }


        button {

            width: 100%;

            padding: 10px;

            border: none;

            border-radius: 6px;

            background: #111827;

            color: white;

            font-size: 14px;

            cursor: pointer;
        }


        button:hover:not(:disabled) {

            background: #374151;
        }


        button:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        #message {

            margin-top: 12px;

            font-size: 13px;
        }


        .github-status {

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 6px;

            background: #f3f4f6;

            font-size: 14px;
        }


        .sync-hint {

            font-size: 12px;

            color: #6b7280;

            line-height: 1.4;
        }


        .sync-card {

            margin-top: 10px;

            padding: 15px;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            background: #f9fafb;
        }


        .sync-card-header {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 15px;
        }


        .sync-icon {

            width: 34px;

            height: 34px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #e5e7eb;

            font-size: 18px;

            flex-shrink: 0;
        }


        .sync-info {

            flex: 1;

            min-width: 0;
        }


        .sync-title {

            font-size: 14px;

            font-weight: 600;

            line-height: 1.3;
        }


        .sync-subtitle {

            margin-top: 3px;

            font-size: 11px;

            color: #6b7280;

            line-height: 1.3;
        }


        .sync-count {

            font-size: 12px;

            font-weight: 600;

            white-space: nowrap;
        }


        .sync-progress-row {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 10px;
        }


        .sync-progress-track {

            flex: 1;

            height: 8px;

            overflow: hidden;

            border-radius: 999px;

            background: #e5e7eb;
        }


        .sync-progress-bar {

            height: 100%;

            width: 0%;

            border-radius: 999px;

            background: #111827;

            transition:
                    width 0.25s ease;
        }


        .sync-percent {

            width: 35px;

            text-align: right;

            font-size: 11px;

            font-weight: 600;
        }


        .sync-current-problem {

            margin-top: 8px;

            margin-bottom: 12px;

            font-size: 11px;

            color: #6b7280;

            line-height: 1.4;

            word-break: break-word;
        }


        #stop-sync {

            width: 100%;

            padding: 8px;

            background: #dc2626;

            font-size: 12px;
        }


        #stop-sync:hover:not(:disabled) {

            background: #b91c1c;
        }


        .sync-result {

            margin-top: 10px;

            margin-bottom: 12px;

            padding-top: 4px;
        }


        .sync-result-row {

            display: flex;

            justify-content: space-between;

            gap: 10px;

            padding: 6px 0;

            border-bottom: 1px solid #e5e7eb;

            font-size: 12px;
        }


        .sync-result-row:last-child {

            border-bottom: none;
        }


        .sync-result-row span {

            color: #6b7280;
        }


        .sync-result-row strong {

            color: #111827;

            text-align: right;
        }

    </style>

</head>


<body>

<h2>
    LeetGit
</h2>


<div id="login-section">

    Loading...

</div>


<script src="popup.js"></script>

</body>

</html>
